name: tests

# main deployt automatisch naar Cloudflare Pages, dus de tests moeten draaien
# voordat er iets gemerged wordt.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  jest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm test
